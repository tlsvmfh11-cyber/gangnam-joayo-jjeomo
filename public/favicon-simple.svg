<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="50%" style="stop-color:#d4af37"/>
      <stop offset="100%" style="stop-color:#ffd700"/>
    </linearGradient>
    <radialGradient id="shine">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#fff;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- 배경 -->
  <circle cx="64" cy="64" r="64" fill="#0a0a0a"/>

  <!-- 골드 원형 테두리 -->
  <circle cx="64" cy="64" r="56" fill="none" stroke="url(#gold)" stroke-width="8" opacity="0.9"/>

  <!-- 내부 원 -->
  <circle cx="64" cy="64" r="48" fill="#1a1a1a"/>

  <!-- 별 아이콘 -->
  <path d="M 64 24 L 71 48 L 96 48 L 76 62 L 83 86 L 64 72 L 45 86 L 52 62 L 32 48 L 57 48 Z"
        fill="url(#gold)"
        opacity="0.95"/>

  <!-- 반짝임 효과 -->
  <circle cx="50" cy="40" r="8" fill="url(#shine)"/>
  <circle cx="78" cy="45" r="5" fill="url(#shine)"/>
</svg>